# WOLF CI: deploy only when every gate passes, then watch and roll back on failure.
name: ci
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: '*/30 * * * *' }]   # uptime check
permissions: { contents: read }
concurrency: { group: 'ci-${{ github.ref }}', cancel-in-progress: true }

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }   # gitleaks lists PR commits
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx next typegen
      - run: npm run check            # db scope + typecheck + eslint + lint:slop + unit/data/i18n tests + isolation
      - run: npm run build            # static export; fails on any record that does not parse
      - name: e2e + accessibility (served by the Worker, as in production)
        run: npx playwright install --with-deps chromium && npm run e2e
      - run: npm audit --audit-level=high --omit=dev
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  gate:
    # Data-bot PRs are exempt from the code PR template; they are gated by data/ path checks instead.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'data/')
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read, actions: read }
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: bash scripts/docs-impact.sh origin/${{ github.base_ref }}
      - env:   # via env, never inline: PR text must not become shell code
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          printf '%s' "$BODY" > /tmp/body
          floor=$(bash scripts/wolf-stats.sh 30 | awk -F': *' '/VU floor/ {print $2}')
          bash scripts/pr-gate.sh /tmp/body "${floor:-1}" "$LABELS"

  data-scope:
    # The data bot may change data only. Any other path in a data/ branch fails, so it can never ship code.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'data/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: |
          bad=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -vE '^data/(records|runs)/' || true)
          [ -z "$bad" ] || { echo "data bot touched non-data paths:"; echo "$bad"; exit 1; }
          echo "data scope: ok"

  deploy:
    needs: verify
    if: github.event_name == 'push' && needs.verify.result == 'success' && vars.PROD_URL != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      URL: ${{ vars.PROD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci && npm run build
      - run: npx wrangler deploy
      - name: smoke test the live site (health reflects real data state)
        run: |
          for i in 1 2 3 4 5 6; do curl -fsS --max-time 10 "$URL/api/health" && curl -fsS -o /dev/null --max-time 10 "$URL/en" && exit 0; sleep 10; done
          exit 1
      - name: rollback on failure
        if: failure()
        run: npx wrangler rollback --message "auto-rollback $GITHUB_SHA" && exit 1

  uptime:
    if: github.event_name == 'schedule' && vars.PROD_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 10 "${{ vars.PROD_URL }}/api/health"
